name: Personal Android APK

on:
  push:
    branches:
      - pocketpal-plus-free
    paths:
      - '.github/workflows/personal-android-build.yml'
      - 'babel.config.js'
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      PLUS_STORE_GATE: 'false'
    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4
        with:
          ref: pocketpal-plus-free

      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Derive llama.rn variant allowlist
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Cache llama.rn native build tree
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Create CI-only Firebase config
        run: |
          cat > android/app/google-services.json <<'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.pocketpalai"}
              },
              "api_key": [{"current_key": "dummy-api-key-for-ci-builds"}]
            }]
          }
          EOL

      - name: Create CI-only environment file
        run: |
          cat > .env <<'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      - name: Create temporary CI signing key
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore pocketpal-release-key.keystore \
            -alias pocketpal_key_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dummy-ci-password \
            -keypass dummy-ci-password \
            -dname "CN=Personal CI Build, OU=CI, O=PocketPal, L=CI, S=CI, C=US"

      - name: Build Android APK
        working-directory: android
        env:
          APP_RELEASE_STORE_PASSWORD: dummy-ci-password
          APP_RELEASE_KEY_PASSWORD: dummy-ci-password
        run: |
          set -euo pipefail
          test "${ORG_GRADLE_PROJECT_rnllamaBuildFromSource:-}" = "true"
          ./gradlew assembleProdRelease --no-daemon 2>&1 | tee android-build.log

      - name: Verify Android payload
        run: |
          node scripts/verify-android-payload.js \
            --apk android/app/build/outputs/apk/prod/release/app-prod-release.apk \
            --report payload-report.txt

      - name: Verify Plus gate is disabled
        run: scripts/verify-plus-gate.sh android/app/build/outputs/apk/prod/release/app-prod-release.apk --ungated

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-plus-free-apk
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-build-reports
          path: |
            android/android-build.log
            payload-report.txt
          if-no-files-found: ignore
          retention-days: 14
